  const d = S.data;
  download('gajuraage-collections.csv', csv([['Received', 'Tenant', 'Space', 'Rent month', 'Rent (MVR)', 'Fine (MVR)', 'Paid from', 'Method', 'Reference', 'Note'],
    ...d.payments.map(p => { const l = d.leaseById[p.lease_id]; return [p.received_on, l?.tenant_name, d.spaceById[l?.space_id]?.name, C.monthKey(p.period), p.rent_amount, p.fine_amount, p.source, p.method, p.reference, p.note]; })]));
}
function csvReport() {
  const r = reportData();
  download(`gajuraage-${r.member.name.replace(/\W+/g, '-').toLowerCase()}-${r.from}-to-${r.to}.csv`, csv([['Month', 'Building net (MVR)', 'Share (MVR)', 'Paid (MVR)', 'Paid on'],
    ...r.rows.map(x => [x.month, x.buildingNet, x.entitlement, x.paid, x.payouts.map(p => p.paid_on).join(' ')]), ['Total', '', r.entitled, r.paid, '']]));
}
function pdfReport() {
  const d = S.data, r = reportData();
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  doc.setFillColor(11, 11, 12); doc.rect(0, 0, W, 86, 'F');
  doc.setDrawColor(201, 166, 70); doc.setLineWidth(1.5); doc.line(0, 86, W, 86);
  doc.setTextColor(212, 175, 55); doc.setFont('times', 'bold'); doc.setFontSize(22); doc.text('GAJURAAGE', 40, 44, { charSpace: 3 });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(200, 192, 170); doc.text('Rental income statement  ·  ' + d.settings.building_name.replace('é', 'e'), 40, 64);
  doc.setFontSize(11);
  const lines = [['Member', r.member.name], ['Share', r.member.share_type === 'fixed' ? `Fixed MVR ${num(d.settings.fixed_amount)} a month, paid first` : `Equal 1/${d.wf.equalIds.length} of balance after fixed amount`],
    ['Period', `${fMonth(r.from)} to ${fMonth(r.to)}`], ['Generated', `${fDate(d.today)} by ${S.session.user.email}`]];
  let y = 118; lines.forEach(([k, v]) => { doc.setTextColor(120, 112, 96); doc.text(k, 40, y); doc.setTextColor(25, 22, 18); doc.text(v, 130, y); y += 17; });
  y += 8;
  [['Earned in period', r.entitled], ['Paid to member', r.paid], ['Still owed overall', r.overall.balance]].forEach(([k, v], i) => {
    const x = 40 + i * ((W - 80) / 3);
    doc.setFontSize(8.5); doc.setTextColor(150, 120, 40); doc.text(k.toUpperCase(), x, y);
    doc.setFontSize(15); doc.setTextColor(25, 22, 18); doc.setFont('helvetica', 'bold'); doc.text('MVR ' + num(v), x, y + 19); doc.setFont('helvetica', 'normal');
  });
  doc.autoTable({
    startY: y + 38, margin: { left: 40, right: 40 },
    head: [['Month', 'Building net', 'Share', 'Paid', 'Paid on / reference']],
    body: r.rows.map(x => [fMonth(x.month) + (x.inProgress ? ' (in progress)' : ''), num(x.buildingNet), num(x.entitlement), num(x.paid), x.payouts.map(p => fDate(p.paid_on) + (p.reference ? ' · ' + p.reference : '')).join('\n') || '-']),
    foot: [['Total (MVR)', '', num(r.entitled), num(r.paid), '']],
    headStyles: { fillColor: [11, 11, 12], textColor: [212, 175, 55] }, footStyles: { fillColor: [245, 238, 218], textColor: [25, 22, 18] },
    styles: { fontSize: 9.5, cellPadding: 6 }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } }
  });
  const fy = doc.lastAutoTable.finalY + 24;
  doc.setFontSize(8.5); doc.setTextColor(120, 112, 96);
  doc.text(doc.splitTextToSize('Shares are calculated on rent and fines actually received in each month, plus any security deposit kept, less building expenses. The fixed monthly amount is paid first; the balance is divided equally between the siblings. Deposits and unused advances are held for tenants and are not shared. A month marked in progress may still change.', W - 80), 40, fy);
  doc.save(`gajuraage-${r.member.name.replace(/\W+/g, '-').toLowerCase()}-${r.from}-to-${r.to}.pdf`);
}

/* ---------- events ---------- */
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-drill][tabindex],tr.go[tabindex]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-drill],[data-tab],[data-act],[data-del],[data-edit],[data-setpw],[data-statement],[data-pay],[data-waive],[data-bill],[data-deposit-for],[data-doc],[data-deldoc],[data-attach],[data-receipt],[data-approve],[data-decline],[data-steps],[data-delstep]');
  if (!t) return;
  const ds = t.dataset, d = S.data;
  if (ds.drill) return drill(ds.drill, ds.back);
  if (ds.tab) { S.tab = ds.tab; window.scrollTo(0, 0); return render(); }
  if (ds.statement) { S.lastStatement = ds.statement; return statement(ds.statement); }
  if (ds.steps) return stepsDialog(ds.steps);
  if (ds.delstep) { const st = S.data.steps.find(x => x.id === ds.delstep); if (!st || !confirm(`Remove the rent change from ${fMonth(C.monthKey(st.effective_from))}?`)) return; const { error } = await sb.from('rent_steps').delete().eq('id', st.id); if (error) return toast(error.message); toast('Removed'); await load(); return stepsDialog(st.lease_id); }
  if (ds.approve) return approveForm(ds.approve);
  if (ds.decline) return declineRequest(ds.decline);
  if (ds.receipt) return sendReceipt(ds.receipt);
  if (ds.doc) return openDoc(ds.doc);
  if (ds.deldoc) return deleteDoc(ds.deldoc);
  if (ds.attach) { const [k, id, m] = ds.attach.split(':'); returnTo = dlg.open && dlg.className === 'wide' ? id : null; return attachForm(k, id, m); }
  if (ds.pay) { const [id, m, src] = ds.pay.split(':'); returnTo = id; return payForm(id, m, src); }
  if (ds.waive) { const [id, m] = ds.waive.split(':'); returnTo = id; return waiveForm(id, m); }
  if (ds.depositFor) { returnTo = ds.depositFor; return depositForm(ds.depositFor); }
  if (ds.bill) { const [a, k, id, m] = ds.bill.split(':'); return billing(a, k, id, m); }
  if (ds.setpw) return setPasswordForm(ds.setpw);
  if (ds.del) { const [tb, id] = ds.del.split(':'); if (confirm('Delete this entry permanently? It will still appear in the activity log.')) await del(tb, id); return; }
  if (ds.edit) { const [tb, id] = ds.edit.split(':'); return editRecord(tb, id); }
  switch (ds.act) {
    case 'request-access': renderRequest(1); break;
    case 'to-login': renderLogin(); break;
    case 'signout': S.channel && sb.removeChannel(S.channel); S.channel = null; sb.auth.signOut(); break;
    case 'mypass': openForm({ title: 'Change your password', fields: [
      { name: 'p1', label: 'New password', type: 'password', required: true, help: 'At least 8 characters' },
      { name: 'p2', label: 'Repeat new password', type: 'password', required: true }],
      submit: async v => {
        if ((v.p1 || '').length < 8) { toast('Use at least 8 characters'); return false; }
        if (v.p1 !== v.p2) { toast('The two passwords do not match'); return false; }
        const { error } = await sb.auth.updateUser({ password: v.p1 });
        if (error) { toast(error.message); return false; }
        toast('Password changed');
      } }); break;
    case 'pay': returnTo = null; payForm(); break;
    case 'deposit': returnTo = null; depositForm(); break;
    case 'payouts': payoutsForm(); break;
    case 'expense': openForm({ title: 'Building expense', fields: [
      { name: 'spent_on', label: 'Date', type: 'date', required: true, half: true }, { name: 'amount', label: 'Amount (MVR)', type: 'number', required: true, half: true },
      { name: 'description', label: 'Description', required: true }], values: { spent_on: d.today },
      intro: '<p class="help" style="margin:-8px 0 14px">Deducted from that month\'s collections before shares are worked out.</p>',
      submit: v => save('expenses', v) }); break;
    case 'lease-new': openForm({ title: 'Add agreement', fields: LEASE_FIELDS(), values: { due_day: 10, grace_days: 0, fine_type: 'none', start_date: d.today, auto_invoice: true },
      submit: v => save('leases', leaseRow(v)) }); break;
    case 'space-new': openForm({ title: 'Add space', fields: [{ name: 'name', label: 'Name', required: true }, { name: 'description', label: 'Description' }, { name: 'sort', label: 'Display order', type: 'number' }],
      submit: v => save('spaces', { ...v, sort: v.sort ?? 100 }) }); break;
    case 'member-new': openForm({ title: 'Add member', fields: MEMBER_FIELDS, values: { share_type: 'equal', active: true, sort: 20 },
      submit: v => save('members', { ...v, email: v.email ? v.email.toLowerCase() : null, sort: v.sort ?? 100 }) }); break;
    case 'settings': openForm({ title: 'Settings', fields: [
      { name: 'building_name', label: 'Building name', required: true },
      { name: 'tracking_start', label: 'Track rent from', type: 'date', required: true, help: 'Months before this are ignored for arrears and shares' },
      { name: 'fixed_amount', label: 'Fixed monthly amount (MVR)', type: 'number', required: true, half: true },
      { name: 'fine_cap_pct', label: 'Daily fine cap (% of rent)', type: 'number', required: true, half: true },
      { name: 'emails_enabled', label: 'Send invoices and reminders automatically', type: 'checkbox' },
      { name: 'invoice_day', label: 'Invoice on day of month', type: 'number', required: true, half: true },
      { name: 'reminder_interval_days', label: 'Repeat reminders every (days)', type: 'number', required: true, half: true },
      { name: 'sender_name', label: 'Sender name on emails', required: true, half: true },
      { name: 'cc_email', label: 'Send a copy of every email to', type: 'email', half: true },
      { name: 'payment_instructions', label: 'Payment instructions on invoices', type: 'textarea', help: 'e.g. bank, account name and number, and who to contact' }],
      values: d.settings, submit: v => save('settings', { ...v, cc_email: v.cc_email ? v.cc_email.toLowerCase() : null, updated_at: new Date().toISOString() }, 1) }); break;
    case 'run-billing': {
      if (!confirm('Run today\'s billing now? Invoices and reminders that are due will be emailed to tenants.')) return;
      const { data, error } = await sb.functions.invoke('billing', { body: { mode: 'daily' } });
      if (error) return toast(await fnError(error), 6000);
      toast(data.skipped || `${data.results.length} email(s): ${data.results.filter(r => r.status === 'sent').length} sent`, 6000); load(); break;
    }
    case 'test-email': {
      const { error } = await sb.functions.invoke('billing', { body: { mode: 'test' } });
      toast(error ? await fnError(error) : `Test email sent to ${d.settings.cc_email}`, 6000); break;
    }
    case 'connect-gmail': connectGmailForm(); break;
    case 'csv-collections': csvCollections(); break;
    case 'csv-report': csvReport(); break;
    case 'pdf': pdfReport(); break;
  }
});

init();
</script>
</body>
</html>
