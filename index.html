<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Gajuraage Family Rent</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23070707'/><path d='M7 22 L9 11 L13.5 16 L16 9 L18.5 16 L23 11 L25 22 Z' fill='none' stroke='%23d4af37' stroke-width='1.8' stroke-linejoin='round'/><path d='M7 25h18' stroke='%23d4af37' stroke-width='1.8'/></svg>">
<style>
:root{
  --bg:#070707;--surface:rgba(17,16,15,.74);--surface-solid:#121110;--surface-2:rgba(255,255,255,.035);
  --ink:#f3eee2;--muted:#9c9586;--faint:#6d675c;
  --line:rgba(212,175,55,.17);--line-2:rgba(255,255,255,.065);
  --gold:#d4af37;--gold-hi:#f4dd94;--gold-lo:#a8812a;
  --good:#8fcfa4;--good-bg:rgba(143,207,164,.11);--warn:#e8bd66;--warn-bg:rgba(232,189,102,.12);--bad:#ee8a74;--bad-bg:rgba(238,138,116,.12);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:rgba(212,175,55,.35)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.01em;margin:0;color:var(--ink)}
h2{font-size:1.55rem} h3{font-size:1.22rem}
a{color:var(--gold-hi)}

/* ---------- animated backdrop ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#1a160d 0%,#0b0a08 45%,#050505 100%)}
.bg::before{content:'';position:absolute;inset:-60%;background-image:linear-gradient(rgba(212,175,55,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.045) 1px,transparent 1px);background-size:64px 64px;transform:rotate(45deg);-webkit-mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 62%);mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 62%);animation:lattice 90s linear infinite}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(244,221,148,.05) 50%,transparent 65%);background-size:300% 100%;animation:sheen 16s ease-in-out infinite}
.orb{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.orb.a{width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,rgba(212,175,55,.32),transparent 68%);animation:driftA 34s ease-in-out infinite alternate}
.orb.b{width:40vmax;height:40vmax;right:-16vmax;bottom:-16vmax;background:radial-gradient(circle,rgba(168,129,42,.30),transparent 68%);animation:driftB 42s ease-in-out infinite alternate}
.orb.c{width:24vmax;height:24vmax;left:52%;top:38%;background:radial-gradient(circle,rgba(244,221,148,.13),transparent 70%);animation:driftC 50s ease-in-out infinite alternate}
.spark{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 6px 1px rgba(244,221,148,.7);opacity:0;animation:rise linear infinite}
@keyframes lattice{to{background-position:640px 640px}}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@keyframes driftA{to{transform:translate(18vmax,10vmax) scale(1.12)}}
@keyframes driftB{to{transform:translate(-14vmax,-12vmax) scale(1.18)}}
@keyframes driftC{to{transform:translate(-22vmax,8vmax) scale(.85)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}88%{opacity:.5}100%{transform:translateY(-70vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.bg::before,.bg::after,.orb,.spark{animation:none!important}.spark{display:none}}

/* ---------- layout ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:22px;padding-bottom:16px}
.brand{display:flex;align-items:center;gap:14px}
.crest{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,rgba(212,175,55,.18),rgba(0,0,0,.2))}
.wordmark{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.7rem;letter-spacing:.2em;line-height:1;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.76rem;color:var(--muted);letter-spacing:.06em;margin-top:5px}
.who{text-align:right;font-size:.8rem;color:var(--muted)}
.who b{color:var(--ink);font-weight:500}
.who .row{justify-content:flex-end;margin-top:6px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);opacity:.45}
nav.tabs{position:sticky;top:0;z-index:5;background:rgba(7,7,7,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;position:relative;background:none;border:0;color:var(--muted);font:500 .9rem Inter,sans-serif;padding:15px 13px 13px;cursor:pointer;transition:color .2s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--gold-hi)}
nav.tabs button.on::after{content:'';position:absolute;left:13px;right:13px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold-lo))}
main{padding:6px 0 80px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:22px}
.kpi .l{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
.kpi .v.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .v .cur{font-size:.55em;letter-spacing:.08em;margin-right:4px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.kpi .n{font-size:.78rem;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.cols{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:34px 0 14px}
.eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line-2)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.chip.gold{background:rgba(212,175,55,.12);color:var(--gold-hi);border-color:transparent}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:500}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;border-bottom:0;color:var(--gold-hi)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tablewrap table tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s} tbody tr:hover{background:rgba(212,175,55,.035)}
.muted{color:var(--muted)} .small{font-size:.82rem} .faint{color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.lease dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0;font-size:.88rem}
.lease dt{color:var(--muted)} .lease dd{margin:0;font-variant-numeric:tabular-nums}
.lease .rent{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;color:var(--gold-hi)}
.bar{height:4px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:7px 0 3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi))}
.strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.strip span{width:32px;height:26px;border-radius:7px;font-size:.6rem;display:grid;place-items:center;font-weight:600;background:var(--surface-2);color:var(--faint);border:1px solid var(--line-2)}
.strip .ontime{background:var(--good-bg);color:var(--good);border-color:transparent}.strip .late{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.strip .unpaid,.strip .partial{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:30px}
.bars b{display:block;width:100%;max-width:40px;border-radius:8px 8px 2px 2px;min-height:2px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));box-shadow:0 0 18px rgba(212,175,55,.18)}
.bars b.prog{background:repeating-linear-gradient(45deg,rgba(212,175,55,.85) 0 5px,rgba(212,175,55,.3) 5px 10px)}
.bars small{font-size:.66rem;color:var(--muted);margin-top:6px;white-space:nowrap}
.bars .val{font-size:.64rem;color:var(--gold-hi);margin-bottom:4px}
.alert{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:.9rem;align-items:flex-start}
.alert:last-child{border-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,#ecd07a,#c49a34);color:#16120a;border:0;border-radius:11px;padding:10px 16px;font:600 .86rem Inter,sans-serif;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 20px rgba(212,175,55,.15);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold-hi);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(212,175,55,.07)}
.btn.small{padding:6px 11px;font-size:.76rem;border-radius:9px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(238,138,116,.3);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.drill{cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.drill:hover{border-color:rgba(212,175,55,.55);transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.drill:focus-visible,.bars [data-drill]:focus-visible,tr.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kpi .go-hint{float:right;color:var(--gold);opacity:.55;font-size:.95rem;line-height:1;transition:opacity .15s,transform .15s}
.drill:hover .go-hint{opacity:1;transform:translateX(2px)}
.bars [data-drill]{cursor:pointer}
.bars [data-drill]:hover b{filter:brightness(1.18)}
.bars [data-drill]:hover small{color:var(--gold-hi)}
tr.go{cursor:pointer}
tr.go:hover td{background:rgba(212,175,55,.06)}
tr.go td:first-child{position:relative}
.linkbtn{background:none;border:0;padding:0;color:var(--gold-hi);font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(212,175,55,.4)}
.iconbtn{background:none;border:0;color:var(--faint);cursor:pointer;font-size:.95rem;padding:2px 6px}
.iconbtn:hover{color:var(--bad)}
label.f{display:block;font-size:.76rem;color:var(--muted);font-weight:500;margin-bottom:12px;letter-spacing:.02em}
label.f input,label.f select,label.f textarea,select.inline{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.03);color:var(--ink);font:15px Inter,sans-serif;outline:none;transition:border-color .15s,box-shadow .15s}
label.f input:focus,label.f select:focus,label.f textarea:focus,select.inline:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
select option{background:#121110;color:var(--ink)}
select.inline{display:inline-block;width:auto;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator{filter:invert(.75) sepia(1) saturate(3) hue-rotate(5deg)}
label.chk{display:flex;gap:9px;align-items:center;font-size:.9rem;margin-bottom:12px;color:var(--ink)}
label.chk input{accent-color:var(--gold);width:16px;height:16px}
.help{font-size:.74rem;color:var(--faint);margin-top:4px;font-weight:400}
dialog{border:1px solid var(--line);border-radius:20px;padding:0;width:min(580px,calc(100vw - 20px));max-height:calc(100vh - 30px);background:var(--surface-solid);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)}
dialog.wide{width:min(920px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
dialog .inner{padding:24px}
dialog h3{margin-bottom:16px;font-size:1.45rem}
dialog iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:12px;background:#f4f1ea}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:540px){.two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1813;color:var(--gold-hi);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:.88rem;z-index:50;max-width:90vw;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:fade .25s ease}
.login{max-width:410px;margin:13vh auto 0;padding:0 18px;text-align:center}
.login .card{padding:34px 28px;text-align:left}
.login .crest{width:72px;height:72px;margin:0 auto 18px}
.login .wordmark{font-size:2.3rem}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:.85rem}
.adminlist .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.adminlist .item:last-child{border-bottom:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.split .card{padding:14px}
.doc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(212,175,55,.06);color:var(--gold-hi);font-size:.76rem;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc:hover{background:rgba(212,175,55,.12)}
.doc svg{flex:none}
.docs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=file]{font-size:.85rem;color:var(--muted)}
input[type=file]::file-selector-button{margin-right:10px;border:1px solid var(--line);background:rgba(212,175,55,.08);color:var(--gold-hi);border-radius:9px;padding:7px 12px;font:500 .8rem Inter,sans-serif;cursor:pointer}
.loading{display:grid;place-items:center;height:60vh;color:var(--gold);font-family:'Cormorant Garamond',serif;letter-spacing:.3em;font-size:1.1rem}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:nowrap}
.dhead > div{min-width:0}
.split{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
@media (max-width:600px){
  header.top .wrap{padding-top:16px;padding-bottom:12px;align-items:flex-start}
  .crest{width:38px;height:38px}
  .wordmark{font-size:1.25rem;letter-spacing:.16em}
  .sub{font-size:.7rem}
  .who{font-size:.74rem;max-width:42%}
  .who .row{gap:8px;flex-wrap:wrap}
  .kpi .v{font-size:1.5rem}
  .card{padding:16px}
  .split{grid-template-columns:1fr 1fr}
  dialog .inner{padding:18px}
  nav.tabs button{padding:13px 10px 11px;font-size:.86rem}
}

/* ---------- entrance ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#16120a 0%,#070707 60%);cursor:pointer;transition:opacity .7s ease,visibility .7s}
#intro.gone{opacity:0;visibility:hidden}
#intro .stage{text-align:center;transform:translateY(-4vh)}
#intro svg{width:84px;height:84px;display:block;margin:0 auto 22px;overflow:visible}
#intro .draw{fill:none;stroke:url(#ig);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:idraw 1.1s cubic-bezier(.6,.1,.3,1) .15s forwards}
#intro .gem{opacity:0;transform-box:fill-box;transform-origin:center;animation:igem .5s ease 1s forwards}
#intro .name{position:relative;display:inline-flex;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(2.2rem,9vw,4.4rem);line-height:1;overflow:hidden;padding:.1em .2em}
#intro .name span{display:inline-block;opacity:0;letter-spacing:.9em;transform:translateY(.35em);filter:blur(6px);background:linear-gradient(180deg,#f7e6a6,#d4af37 55%,#9c7624);-webkit-background-clip:text;background-clip:text;color:transparent;animation:iletter .9s cubic-bezier(.2,.7,.2,1) forwards}
#intro .name::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,244,205,.55),transparent);transform:skewX(-18deg);animation:isweep 1s ease 1.75s forwards}
#intro .rule{width:0;height:1px;margin:18px auto 14px;background:linear-gradient(90deg,transparent,#d4af37,transparent);animation:irule .9s ease 1.5s forwards}
#intro .tag{opacity:0;font:500 .72rem Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#a39b87;animation:ifade .8s ease 1.8s forwards}
#intro .skip{position:absolute;bottom:28px;left:0;right:0;text-align:center;font:400 .68rem Inter,sans-serif;letter-spacing:.2em;color:#5d574b;opacity:0;animation:ifade .6s ease 1s forwards}
@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes igem{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes iletter{to{opacity:1;letter-spacing:.2em;transform:none;filter:none}}
@keyframes isweep{to{left:130%}}
@keyframes irule{to{width:min(260px,60vw)}}
@keyframes ifade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="stage">
  <svg viewBox="0 0 32 32"><defs><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e6a6"/><stop offset="1" stop-color="#a8812a"/></linearGradient></defs>
    <path class="draw" d="M6 22 L8.5 10.5 L13.5 16 L16 8 L18.5 16 L23.5 10.5 L26 22 Z"/><path class="draw" style="animation-delay:.6s" d="M6 25.5h20"/>
    <circle class="gem" cx="16" cy="8" r="1.3" fill="#f4dd94"/><circle class="gem" style="animation-delay:1.1s" cx="8.5" cy="10.5" r="1.1" fill="#d4af37"/><circle class="gem" style="animation-delay:1.15s" cx="23.5" cy="10.5" r="1.1" fill="#d4af37"/></svg>
  <div class="name">GAJURAAGE</div>
  <div class="rule"></div>
  <div class="tag">Ma. Gajuraage &middot; K. Mal&eacute;</div>
</div><div class="skip">TAP TO ENTER</div></div>
<script>
/* entrance: once per visit, tap to skip */
(function intro() {
  const el = document.getElementById('intro');
  if (!el) return;
  let seen = false; try { seen = sessionStorage.getItem('gj-intro') === '1'; } catch (_) {}
  if (seen) { el.remove(); return; }
  const name = el.querySelector('.name'), word = name.textContent; name.textContent = '';
  [...word].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = (0.55 + i * 0.07) + 's'; name.appendChild(s); });
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done = () => { if (el.classList.contains('gone')) return; el.classList.add('gone'); try { sessionStorage.setItem('gj-intro', '1'); } catch (_) {} setTimeout(() => el.remove(), 800); };
  el.addEventListener('click', done);
  setTimeout(done, reduce ? 700 : 2800);
})();
</script>
<div class="bg" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div id="sparks"></div></div>
<div id="app"><div class="loading">GAJURAAGE</div></div>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="calc.js"></script>
<script>
const C = window.Calc;
const sb = supabase.createClient(GAJ_CONFIG.supabaseUrl, GAJ_CONFIG.supabaseKey);
const TZ = 'Indian/Maldives';
const todayStr = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
var S = window.S = { session: null, data: null, tab: 'overview', showEnded: false, rep: {}, colFilter: '', channel: null };
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');


/* gold sparks drifting upward */
(function sparks() {
  const host = document.getElementById('sparks');
  if (!host || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    s.style.left = (Math.random() * 100) + 'vw'; s.style.top = (60 + Math.random() * 45) + 'vh';
    s.style.animationDuration = (14 + Math.random() * 18) + 's'; s.style.animationDelay = (-Math.random() * 30) + 's';
    s.style.transform = `scale(${0.6 + Math.random()})`; host.appendChild(s);
  }
})();

const CREST = (size = 26) => `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4dd94"/><stop offset="1" stop-color="#a8812a"/></linearGradient></defs><path d="M6 22 L8.5 10.5 L13.5 16 L16 8 L18.5 16 L23.5 10.5 L26 22 Z" fill="none" stroke="url(#gg)" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 25.5h20" stroke="url(#gg)" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="8" r="1.3" fill="#f4dd94"/><circle cx="8.5" cy="10.5" r="1.1" fill="#d4af37"/><circle cx="23.5" cy="10.5" r="1.1" fill="#d4af37"/></svg>`;

/* ---------- formatting ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (+n || 0).toLocaleString('en-GB', { minimumFractionDigits: (+n % 1) ? 2 : 0, maximumFractionDigits: 2 });
const mvr = n => 'MVR ' + num(n);
const big = n => `<span class="cur">MVR</span>${num(n)}`;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return +d + ' ' + MON[+m - 1] + ' ' + y; };
const fMonth = k => { if (!k) return ''; const [y, m] = k.split('-'); return MON[+m - 1] + ' ' + y; };
const fMonthShort = k => { const [y, m] = k.split('-'); return MON[+m - 1] + ' ' + y.slice(2); };
const toast = (msg, ms = 3400) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); };

const STATUS = {
  ontime: ['good', () => 'Paid on time'], late: ['warn', r => `Paid ${r.daysLate}d late`],
  due: ['', r => 'Due ' + fDate(r.deadline)], partdue: ['', r => 'Part paid, due ' + fDate(r.deadline)],
  partial: ['bad', r => `Part paid, ${r.daysLate}d overdue`], unpaid: ['bad', r => `Unpaid, ${r.daysLate}d overdue`]
};
const LSTAT = { active: 'good', expiring: 'warn', ended: '', upcoming: 'gold' };
const RECORD = { clean: 'good', late: 'warn', arrears: 'bad', none: '' };
const INVSTAT = { sent: 'good', failed: 'bad', pending: 'warn' };
const KIND = { rent: 'Rent invoice', fine: 'Fine invoice', reminder: 'Reminder', receipt: 'Payment receipt', statement: 'Ageing statement' };
const DEPKIND = { security_in: 'Security deposit received', security_refund: 'Security deposit refunded', security_retained: 'Deposit shared out to owners', advance_in: 'Advance rent received', advance_refund: 'Advance rent refunded' };
const chip = (cls, text) => `<span class="chip ${cls}">${esc(text)}</span>`;

function fineText(l, settings) {
  const v = +l.fine_value;
  if (l.fine_type === 'daily') return `${mvr(v)} per day late` + (+settings.fine_cap_pct ? `, capped at ${num(settings.fine_cap_pct)}% of rent` : '');
  if (l.fine_type === 'percent') return `${num(v)}% of monthly rent if late`;
  if (l.fine_type === 'flat') return `${mvr(v)} flat if late`;
  return 'No late fine';
}
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

/* ---------- auth + data ---------- */
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  S.session = session;
  sb.auth.onAuthStateChange((evt, s) => {
    const changed = (s?.user?.id) !== (S.session?.user?.id);
    S.session = s;
    if (changed) boot();
  });
  boot();
}
function boot() { if (!S.session) return renderLogin(); load(); }

async function load() {
  const q = (t, o, asc = true) => sb.from(t).select('*').order(o, { ascending: asc });
  const res = await Promise.all([
    sb.from('settings').select('*').maybeSingle(), q('members', 'sort'), q('spaces', 'sort'), q('leases', 'start_date'),
    q('payments', 'received_on', false), q('expenses', 'spent_on', false), q('distributions', 'paid_on', false),
    sb.from('audit_log').select('*').order('at', { ascending: false }).limit(150),
    q('deposits', 'occurred_on', false), q('fine_waivers', 'created_at', false), q('invoices', 'created_at', false), q('attachments', 'created_at', false), q('access_requests', 'created_at', false), q('rent_steps', 'effective_from')
  ]);
  const err = res.slice(0, 12).find(r => r.error);
  if (err) { app.innerHTML = `<div class="empty">Could not load data: ${esc(err.error.message)}</div>`; return; }
  const [settings, members, spaces, leases, payments, expenses, distributions, audit, deposits, waivers, invoices, attachments, requests, steps] = res.map(r => r.data || []);
  for (const l of leases) l.rent_steps = steps.filter(x => x.lease_id === l.id);
  if (!settings || (Array.isArray(settings) && !settings.length)) return renderNotMember();
  const email = S.session.user.email.toLowerCase();
  const me = members.find(m => (m.email || '').toLowerCase() === email);
  S.data = { settings, members, spaces, leases, payments, expenses, distributions, audit, deposits, waivers, invoices, attachments, requests, steps, me };
  compute(); render(); subscribe();
}

function compute() {
  const d = S.data, t = todayStr();
  d.today = t;
  d.spaceById = Object.fromEntries(d.spaces.map(s => [s.id, s]));
  d.leaseById = Object.fromEntries(d.leases.map(l => [l.id, l]));
  d.memberById = Object.fromEntries(d.members.map(m => [m.id, m]));
  d.sched = {}; d.dep = {};
  for (const l of d.leases) {
    d.sched[l.id] = C.leaseSchedule(l, d.payments, d.settings, t, d.waivers);
    d.dep[l.id] = C.depositSummary(l, d.deposits, d.payments);
  }
  const other = d.deposits.filter(x => x.kind === 'security_retained').map(x => ({ date: x.occurred_on, amount: x.amount }));
  d.wf = C.waterfall(d.members, d.payments, d.expenses, d.settings, t, other);
  d.sharers = d.members.filter(m => m.active && m.share_type !== 'none');
  d.statements = Object.fromEntries(d.sharers.map(m => [m.id, C.memberStatement(m, d.wf, d.distributions)]));
  d.liveLeases = d.leases.filter(l => ['active', 'expiring'].includes(C.leaseStatus(l, t).key));
  d.curRent = l => C.rentFor(l, C.monthKey(t > l.start_date ? t : l.start_date));
  d.leaseName = l => l ? `${l.tenant_name} · ${d.spaceById[l.space_id]?.name || ''}` : '';
  d.attById = Object.fromEntries(d.attachments.map(a => [a.id, a]));
  d.agreementsOf = id => d.attachments.filter(a => a.kind === 'agreement' && a.lease_id === id);
  d.receiptsOf = (id, k) => d.attachments.filter(a => a.kind === 'receipt' && a.lease_id === id && a.period && C.monthKey(a.period) === k);
}

let reloadTimer;
function subscribe() {
  if (S.channel) return;
  S.channel = sb.channel('gajuraage-live')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(load, 600); })
    .subscribe();
}

function renderLogin() {
  app.innerHTML = `<div class="login view">
    <div class="crest">${CREST(40)}</div>
    <div class="wordmark">GAJURAAGE</div>
    <p class="sub" style="margin:10px 0 26px">Family rent portal · Ma. Gajuraage, K. Malé</p>
    <div class="card"><form id="loginForm">
      <label class="f">Email<input type="email" name="email" required autocomplete="username" placeholder="name@example.com"></label>
      <label class="f">Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" style="width:100%;margin-top:4px">Sign in</button>
      <p class="help" style="margin-top:14px;text-align:center">Forgotten your password? Ask the custodian to reset it.</p>
    </form></div>
    ${GAJ_CONFIG.accessRequests ? '<p style="margin-top:18px" class="small muted">Family member without access? <button class="linkbtn" data-act="request-access">Request view access</button></p>' : ''}</div>`;
  const f = document.getElementById('loginForm');
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('button'); btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: f.elements.email.value.trim().toLowerCase(), password: f.elements.password.value });
    if (error) { toast(error.message === 'Invalid login credentials' ? 'Email or password is incorrect' : error.message); btn.disabled = false; }
  };
}
async function renderNotMember() {
  let status = null;
  try { const r = await sb.rpc('my_access_status'); status = r.data; } catch (_) {}
  const msg = status === 'pending' ? ['Awaiting approval', 'Your email is verified and your request is with the custodian. You will receive an email once it is approved.']
    : status === 'declined' ? ['Request not approved', 'Your request was not approved. Please contact the custodian if you think this is a mistake.']
    : ['Not on the list yet', "This email isn't on the Gajuraage family list. Sign out and use Request access, or ask the custodian to add you."];
  app.innerHTML = `<div class="login view"><div class="crest">${CREST(40)}</div><div class="card">
    <h2>${msg[0]}</h2>
    <p class="muted">Signed in as <b style="color:var(--ink)">${esc(S.session.user.email)}</b></p>
    <p>${msg[1]}</p>
    <div class="row"><button class="btn ghost" data-act="signout">Sign out</button><button class="btn ghost" onclick="location.reload()">Refresh</button></div></div></div>`;
}

/* ---------- request access (public) ---------- */
function renderRequest(step = 1, ctx = {}) {
  const card = step === 1 ? `
    <h2 style="margin-bottom:4px">Request view access</h2>
    <p class="muted small" style="margin-top:0">For family members of Ma. Gajuraage. We'll email you a code to confirm your address; the custodian then approves your request.</p>
    <form id="reqForm">
      <label class="f">Full name<input name="name" required autocomplete="name" value="${esc(ctx.name || '')}"></label>
      <label class="f">Email<input type="email" name="email" required autocomplete="email" value="${esc(ctx.email || '')}"></label>
      <label class="f">Relation to the family<input name="relation" placeholder="e.g. son of Ahmed Jaleel" value="${esc(ctx.relation || '')}"></label>
      <label class="f">Note for the custodian (optional)<textarea name="note" rows="2">${esc(ctx.note || '')}</textarea></label>
      <button class="btn" type="submit" style="width:100%">Email me a code</button>
    </form>`
  : step === 2 ? `
    <h2 style="margin-bottom:4px">Check your email</h2>
    <p class="muted small" style="margin-top:0">We sent a 6-digit code to <b style="color:var(--ink)">${esc(ctx.email)}</b>. It expires in 15 minutes. Check spam if you don't see it.</p>
    <form id="reqForm">
      <label class="f">Verification code<input name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="letter-spacing:.4em;font-size:1.3rem;text-align:center"></label>
      <label class="f">Choose a password<input type="password" name="p1" required autocomplete="new-password"><div class="help">At least 8 characters. You'll use it to sign in once approved.</div></label>
      <label class="f">Repeat password<input type="password" name="p2" required autocomplete="new-password"></label>
      <button class="btn" type="submit" style="width:100%">Verify and send request</button>
    </form>`
  : `
    <h2 style="margin-bottom:4px">Request sent</h2>
    <p>Thank you, your email is verified. The custodian has been notified and will review your request.</p>
    <p class="muted small">You'll receive an email when it's approved. You can then sign in with ${esc(ctx.email)} and the password you chose.</p>`;
  app.innerHTML = `<div class="login view"><div class="crest">${CREST(40)}</div><div class="wordmark">GAJURAAGE</div>
    <div class="card" style="margin-top:22px">${card}</div>
    <p style="margin-top:16px"><button class="linkbtn" data-act="to-login">Back to sign in</button></p></div>`;
  const f = document.getElementById('reqForm'); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('button'); btn.disabled = true;
    const E = f.elements;
    if (step === 1) {
      const v = { name: E.name.value.trim(), email: E.email.value.trim().toLowerCase(), relation: E.relation.value.trim(), note: E.note.value.trim() };
      const { data, error } = await sb.functions.invoke('access', { body: { mode: 'request', ...v } });
      if (error) { toast(await fnError(error), 7000); btn.disabled = false; return; }
      renderRequest(2, { ...v, request_id: data.request_id });
    } else {
      if (E.p1.value.length < 8) { toast('Use at least 8 characters'); btn.disabled = false; return; }
      if (E.p1.value !== E.p2.value) { toast('The passwords do not match'); btn.disabled = false; return; }
      const { error } = await sb.functions.invoke('access', { body: { mode: 'verify', request_id: ctx.request_id, code: E.code.value, password: E.p1.value } });
      if (error) { toast(await fnError(error), 7000); btn.disabled = false; return; }
      renderRequest(3, ctx);
    }
  };
}

/* ---------- layout ---------- */
const TABS = [['overview', 'Overview'], ['leases', 'Leases'], ['collections', 'Collections'], ['invoices', 'Invoices'], ['shares', 'Shares'], ['report', 'My report'], ['activity', 'Activity'], ['admin', 'Admin']];

function render() {
  const d = S.data, admin = d.me?.is_admin;
  const tabs = TABS.filter(([k]) => k !== 'admin' || admin);
  if (!tabs.find(([k]) => k === S.tab)) S.tab = 'overview';
  const views = { overview, leases: leasesView, collections, invoices: invoicesView, shares, report, activity, admin: adminView };
  const y = window.scrollY;
  app.innerHTML = `
  <header class="top"><div class="wrap">
    <div class="brand"><div class="crest">${CREST()}</div><div><div class="wordmark">GAJURAAGE</div><div class="sub">${esc(d.settings.building_name)} · live as of ${fDate(d.today)}</div></div></div>
    <div class="who"><b>${esc(d.me?.name || S.session.user.email)}</b>${admin ? ' · admin' : ''}
      <div class="row"><button class="linkbtn" data-act="mypass">Change password</button><button class="linkbtn" data-act="signout">Sign out</button></div></div>
  </div><div class="rule"></div></header>
  <nav class="tabs"><div class="wrap">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div></nav>
  <main><div class="wrap view">${views[S.tab]()}</div></main>`;
  window.scrollTo(0, y);
  afterRender();
}

function afterRender() {
  if (document.getElementById('repMember')) ['repMember', 'repFrom', 'repTo'].forEach(id => document.getElementById(id).onchange = e => { S.rep[id] = e.target.value; render(); });
  const cf = document.getElementById('colFilter'); if (cf) cf.onchange = e => { S.colFilter = e.target.value; render(); };
  const se = document.getElementById('showEnded'); if (se) se.onchange = e => { S.showEnded = e.target.checked; render(); };
  const ss = document.getElementById('senderStatus');
  if (ss) {
    if (S.sender) ss.innerHTML = senderHtml(S.sender);
    sb.functions.invoke('billing', { body: { mode: 'sender_status' } }).then(({ data }) => {
      if (!data) return; S.sender = data; const el = document.getElementById('senderStatus'); if (el) el.innerHTML = senderHtml(data);
    });
  }
}

/* ---------- views ---------- */
function overview() {
  const d = S.data, wf = d.wf, s = d.settings;
  const cur = wf.months[wf.months.length - 1] || { rent: 0, fines: 0, month: C.monthKey(d.today) };
  const collected = wf.months.reduce((a, m) => a + m.rent + m.fines, 0);
  const rentRoll = d.liveLeases.reduce((a, l) => a + d.curRent(l), 0);
  const sums = Object.values(d.sched).map(x => x.summary);
  const arrears = sums.reduce((a, x) => a + x.arrears, 0);
  const fines = sums.reduce((a, x) => a + x.finesOutstanding, 0);
  const paidOut = d.distributions.reduce((a, x) => a + +x.amount, 0);
  const entitled = Object.values(d.statements).reduce((a, x) => a + x.entitled, 0);
  const held = Object.values(d.dep).reduce((a, x) => a + x.securityHeld + x.advanceBalance, 0);
  const eq = wf.equalIds.length, fixedN = wf.fixedIds.length;
  const perSib = eq ? Math.max(0, rentRoll - +s.fixed_amount * fixedN) / eq : 0;
  const maxBar = Math.max(1, rentRoll, ...wf.months.map(m => m.rent + m.fines));
  const months = wf.months.slice(-12);

  const alerts = [];
  for (const l of d.leases) {
    const sc = d.sched[l.id], st = C.leaseStatus(l, d.today), name = esc(d.leaseName(l));
    if (sc.summary.arrears > 0) alerts.push(['bad', 'Arrears', `${name}: ${mvr(sc.summary.arrears)} overdue across ${sc.summary.overdueMonths} month(s)`]);
    if (sc.summary.finesOutstanding > 0) alerts.push(['warn', 'Fine', `${name}: ${mvr(sc.summary.finesOutstanding)} in late fines not yet collected`]);
    if (st.key === 'expiring') alerts.push(['warn', 'Expiring', `${name}: agreement ends ${fDate(l.end_date)} (${C.daysBetween(d.today, l.end_date)} days)`]);
    if (st.key === 'upcoming') alerts.push(['gold', 'Starting', `${name}: starts ${fDate(l.start_date)} at ${mvr(d.curRent(l))}`]);
    const ns = C.nextStep(l, C.monthKey(d.today));
    if (ns && ['active', 'expiring', 'upcoming'].includes(st.key) && C.daysBetween(d.today, ns.effective_from) <= 60) alerts.push(['gold', 'Rent change', `${name}: rent changes to ${mvr(ns.monthly_rent)} from ${fMonth(C.monthKey(ns.effective_from))}`]);
    if (['active', 'expiring'].includes(st.key) && !l.tenant_email && s.emails_enabled) alerts.push(['', 'Email', `${name}: no tenant email, so invoices can't be sent`]);
  }
  const pendingReq = (d.requests || []).filter(r => r.status === 'pending');
  if (d.me?.is_admin && pendingReq.length) alerts.unshift(['gold', 'Access', `${pendingReq.length} access request(s) awaiting your approval in Admin: ${pendingReq.map(r => esc(r.name)).join(', ')}`]);
  const failed = d.invoices.filter(i => i.status === 'failed' && C.daysBetween(i.issued_on, d.today) <= 7);
  if (failed.length) alerts.push(['bad', 'Email', `${failed.length} invoice email(s) failed to send this week. See Invoices.`]);
  return `
  <div class="grid kpis">
    <div class="card kpi drill" data-drill="month:${cur.month}" role="button" tabindex="0" title="See every payment received this month"><div class="l">Collected ${fMonth(cur.month)}<span class="go-hint" aria-hidden="true">›</span></div><div class="v gold">${big(cur.rent + cur.fines)}</div><div class="n">of ${mvr(rentRoll)} monthly rent roll</div></div>
    <div class="card kpi drill" data-drill="since" role="button" tabindex="0" title="See collections month by month and by tenant"><div class="l">Since ${fMonthShort(wf.months[0]?.month || C.monthKey(s.tracking_start))}<span class="go-hint" aria-hidden="true">›</span></div><div class="v">${big(collected)}</div><div class="n">rent and fines received</div></div>
    <div class="card kpi drill ${arrears ? 'bad' : 'good'}" data-drill="overdue" role="button" tabindex="0" title="See arrears and fines by tenant"><div class="l">Rent overdue<span class="go-hint" aria-hidden="true">›</span></div><div class="v">${big(arrears)}</div><div class="n">${fines ? mvr(fines) + ' fines outstanding' : 'no fines outstanding'}</div></div>
    <div class="card kpi drill" data-drill="paid" role="button" tabindex="0" title="See payouts by member and by month"><div class="l">Paid out to family<span class="go-hint" aria-hidden="true">›</span></div><div class="v">${big(paidOut)}</div><div class="n">${mvr(Math.max(0, entitled - paidOut))} earned, not yet paid</div></div>
    <div class="card kpi drill" data-drill="held" role="button" tabindex="0" title="See deposits and advances by tenant"><div class="l">Held for tenants<span class="go-hint" aria-hidden="true">›</span></div><div class="v">${big(held)}</div><div class="n">deposits and unused advances</div></div>
  </div>
  <div class="grid cols" style="margin-top:14px">
    <div class="card">
      <div class="row between"><div><div class="eyebrow">Cash received</div><h3>Monthly collections</h3></div><span class="small faint">Tap a bar for details · striped: in progress</span></div>
      ${months.length ? `<div class="bars">${months.map(m => `<div data-drill="month:${m.month}" role="button" tabindex="0" title="${fMonth(m.month)}: ${mvr(m.rent + m.fines)}. Tap for details"><span class="val">${num(Math.round((m.rent + m.fines) / 1000))}k</span><b class="${m.inProgress ? 'prog' : ''}" style="height:${Math.max(1, Math.round((m.rent + m.fines) / maxBar * 100))}%"></b><small>${fMonthShort(m.month)}</small></div>`).join('')}</div>` : '<div class="empty">No months tracked yet</div>'}
    </div>
    <div class="card drill" data-drill="roll" role="button" tabindex="0" title="See the agreements behind the rent roll">
      <div class="eyebrow">The family share<span class="go-hint" aria-hidden="true" style="float:right;font-size:.95rem;letter-spacing:0">›</span></div><h3>How a full month is divided</h3>
      <table style="margin-top:10px"><tbody>
        <tr><td>Monthly rent roll</td><td class="num">${mvr(rentRoll)}</td></tr>
        ${d.members.filter(m => m.active && m.share_type === 'fixed').map(m => `<tr><td>${esc(m.name)} <span class="faint">(fixed, paid first)</span></td><td class="num">− ${mvr(s.fixed_amount)}</td></tr>`).join('')}
        <tr><td>Balance shared equally by ${eq}</td><td class="num">${mvr(Math.max(0, rentRoll - +s.fixed_amount * fixedN))}</td></tr>
        <tr><td style="color:var(--gold-hi)">Each sibling</td><td class="num" style="color:var(--gold-hi);font-weight:600">${mvr(C.r2(perSib))}</td></tr>
      </tbody></table>
      <p class="help">Worked out on cash actually received each month, after building expenses. Deposits and advances count in the month they are shared out; any still held are shown under Held for tenants. Tap for the agreements behind this.</p>
    </div>
  </div>
  <div class="section-head"><div><div class="eyebrow">Action list</div><h2>Needs attention</h2></div></div>
  <div class="card">${alerts.length ? alerts.map(([c, t, m]) => `<div class="alert">${chip(c, t)}<div>${m}</div></div>`).join('') : '<div class="empty">Nothing outstanding. All rent due has been paid.</div>'}</div>
  <div class="section-head"><div><div class="eyebrow">Ledger</div><h2>Latest collections</h2></div><button class="btn ghost small" data-tab="collections">See all</button></div>
  ${paymentsTable(d.payments.slice(0, 6), false)}`;
}

function leaseCard(l) {
  const d = S.data, sc = d.sched[l.id], st = C.leaseStatus(l, d.today), sp = d.spaceById[l.space_id], dp = d.dep[l.id];
  let prog = '';
  if (l.end_date) {
    const total = C.daysBetween(l.start_date, l.end_date), done = Math.min(total, Math.max(0, C.daysBetween(l.start_date, d.today)));
    const left = C.daysBetween(d.today, l.end_date);
    prog = `<div class="bar"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div><div class="small faint">${left >= 0 ? left + ' days remaining' : 'Ended ' + fDate(l.end_date)}</div>`;
  }
  return `<div class="card lease">
    <div class="row between" style="align-items:flex-start"><div><div class="eyebrow">${esc(sp?.name)}</div><h3>${esc(l.tenant_name)}</h3>${l.billing_name && l.billing_name !== l.tenant_name ? `<div class="small muted">Billed as ${esc(l.billing_name)}</div>` : ''}${l.tenant_email ? `<div class="small faint">${esc(l.tenant_email)}</div>` : ''}</div>
      <div class="actions" style="justify-content:flex-end">${chip(LSTAT[st.key], st.label)}${chip(RECORD[sc.record.key], sc.record.label)}</div></div>
    <dl>
      <dt>Rent</dt><dd><span class="rent">${mvr(d.curRent(l))}</span> <span class="faint">a month</span>${(() => { const ns = C.nextStep(l, C.monthKey(d.today > l.start_date ? d.today : l.start_date)); return ns ? `<div class="small muted">Changes to ${mvr(ns.monthly_rent)} from ${fMonth(C.monthKey(ns.effective_from))}</div>` : ''; })()}<div><button class="linkbtn" data-steps="${l.id}">Rent schedule${l.rent_steps.length ? ` (${l.rent_steps.length + 1} periods)` : ''}</button></div></dd>
      <dt>Term</dt><dd>${fDate(l.start_date)} to ${l.end_date ? fDate(l.end_date) : '<span class="faint">end date to confirm</span>'}${prog}</dd>
      <dt>Due</dt><dd>${ord(+l.due_day)} of each month${+l.grace_days ? `, ${l.grace_days} days' grace` : ''}</dd>
      <dt>Late fine</dt><dd>${esc(fineText(l, d.settings))}</dd>
      <dt>Agreement</dt><dd><div class="docs">${l.agreement_ref ? `<span>${esc(l.agreement_ref)}</span>` : ''}${d.agreementsOf(l.id).map(a => docChip(a, false)).join('') || (l.agreement_ref ? '' : '<span class="faint">no signed copy attached</span>')}${d.me?.is_admin ? `<button class="linkbtn" data-attach="agreement:${l.id}">${d.agreementsOf(l.id).length ? 'Add another' : 'Attach PDF'}</button>` : ''}</div></dd>
      <dt>Deposits</dt><dd>${dp.securityIn || dp.advanceIn ? `Security held ${mvr(dp.securityHeld)}${dp.advanceIn ? ` · Advance left ${mvr(dp.advanceBalance)} of ${mvr(dp.advanceIn)}` : ''}` : '<span class="faint">none recorded</span>'}</dd>
      <dt>Paid</dt><dd>${mvr(sc.summary.rentPaid)} of ${mvr(sc.summary.rentDue)} due${sc.summary.arrears ? ` · <b style="color:var(--bad)">${mvr(sc.summary.arrears)} overdue</b>` : ''}</dd>
      <dt>Fines</dt><dd>${mvr(sc.summary.finesAccrued)} charged${sc.summary.finesWaived ? ` · ${mvr(sc.summary.finesWaived)} waived` : ''} · ${mvr(sc.summary.finesPaid)} collected${sc.summary.finesOutstanding ? ` · <b style="color:var(--warn)">${mvr(sc.summary.finesOutstanding)} owed</b>` : ''}</dd>
      ${l.notes ? `<dt>Notes</dt><dd class="muted">${esc(l.notes)}</dd>` : ''}
    </dl>
    ${sc.rows.length ? `<div class="small faint">Month by month</div><div class="strip">${sc.rows.map(r => `<span class="${r.status}" title="${fMonth(r.month)}: ${esc(STATUS[r.status][1](r))}">${MON[+r.month.slice(5) - 1]}</span>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn ghost small" data-statement="${l.id}">Statement${d.me?.is_admin ? ' and actions' : ''}</button></div>
  </div>`;
}

function leasesView() {
  const d = S.data;
  const list = d.leases.filter(l => S.showEnded || C.leaseStatus(l, d.today).key !== 'ended')
    .sort((a, b) => (d.spaceById[a.space_id]?.sort ?? 0) - (d.spaceById[b.space_id]?.sort ?? 0) || (a.start_date < b.start_date ? -1 : 1));
  const ended = d.leases.filter(l => C.leaseStatus(l, d.today).key === 'ended').length;
  const vacant = d.spaces.filter(sp => !d.liveLeases.some(l => l.space_id === sp.id));
  return `<div class="section-head"><div><div class="eyebrow">${d.liveLeases.length} active</div><h2>Agreements</h2></div>
    ${ended ? `<label class="chk small" style="margin:0"><input type="checkbox" id="showEnded" ${S.showEnded ? 'checked' : ''}> Show ${ended} ended</label>` : ''}</div>
  ${vacant.length ? `<div class="note" style="margin-bottom:14px">Without an active agreement: ${vacant.map(v => esc(v.name)).join(', ')}</div>` : ''}

function paymentsTable(rows, withTotals = true) {
  const d = S.data, admin = d.me?.is_admin;
  if (!rows.length) return '<div class="card empty">No collections recorded yet</div>';

  return `<div class="tablewrap"><table>
    <thead><tr><th>Received</th><th>Tenant</th><th>For</th><th class="num">Rent</th><th class="num">Fine</th><th>Reference</th>${admin ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.map(p => { const l = d.leaseById[p.lease_id]; return `<tr>
      <td style="white-space:nowrap">${fDate(p.received_on)}</td>
      <td>${esc(l?.tenant_name)}<div class="small faint">${esc(d.spaceById[l?.space_id]?.name)}</div></td>

      ${admin ? `<td style="white-space:nowrap">${l?.tenant_email ? `<button class="linkbtn" data-receipt="${p.id}" title="Email a paid receipt">${d.invoices.some(i => i.payment_id === p.id && i.status === 'sent') ? 'Resend receipt' : 'Email receipt'}</button> ` : ''}<button class="iconbtn" title="Delete" data-del="payments:${p.id}">✕</button></td>` : ''}</tr>`; }).join('')}</tbody>
    ${withTotals ? `<tfoot><tr><td colspan="3">Total (MVR)</td><td class="num">${num(tr)}</td><td class="num">${num(tf)}</td><td colspan="${admin ? 2 : 1}"></td></tr></tfoot>` : ''}
  </table></div>`;
}

function depositsTable(rows, showLease = true) {

  ${rows.map(x => `<tr><td style="white-space:nowrap">${fDate(x.occurred_on)}</td>${showLease ? `<td>${esc(d.leaseName(d.leaseById[x.lease_id]))}</td>` : ''}<td>${esc(DEPKIND[x.kind])}</td><td class="num">${num(x.amount)}</td>

  </tbody></table></div>`;
}

  const f = S.colFilter;

    <div class="row"><select class="inline" id="colFilter"><option value="">All collections</option>
      <optgroup label="By month received">${months.map(m => `<option value="m:${m}" ${f === 'm:' + m ? 'selected' : ''}>${fMonth(m)}</option>`).join('')}</optgroup>
      <optgroup label="By tenant">${d.leases.map(l => `<option value="l:${l.id}" ${f === 'l:' + l.id ? 'selected' : ''}>${esc(d.leaseName(l))}</option>`).join('')}</optgroup>

  <div class="section-head"><div><div class="eyebrow">Distributions</div><h2>Payouts made</h2></div>${admin ? '<button class="btn small" data-act="payouts">Record payouts</button>' : ''}</div>
  ${d.distributions.length ? `<div class="tablewrap"><table>
    <thead><tr><th>Paid on</th><th>Member</th><th>For month</th><th class="num">Amount</th><th>Reference</th>${admin ? '<th></th>' : ''}</tr></thead>

      <td class="small">${esc([x.method, x.reference].filter(Boolean).join(' · '))}</td>${admin ? `<td><button class="iconbtn" data-del="distributions:${x.id}">✕</button></td>` : ''}</tr>`).join('')}</tbody>

function repState() {
  const d = S.data, months = d.wf.months.map(m => m.month);
  const def = d.me && d.me.share_type !== 'none' ? d.me.id : d.sharers[0]?.id;
  const member = d.memberById[S.rep.repMember] ? S.rep.repMember : def;
  const from = months.includes(S.rep.repFrom) ? S.rep.repFrom : months[0];
  const to = months.includes(S.rep.repTo) ? S.rep.repTo : months[months.length - 1];
  return { months, member: d.memberById[member], from, to };
}
function reportData() {
  const d = S.data, { member, from, to } = repState();
  const st = d.statements[member.id];
  const rows = st.rows.filter(r => r.month >= from && r.month <= to);
  const entitled = C.r2(rows.reduce((a, r) => a + r.entitlement, 0)), paid = C.r2(rows.reduce((a, r) => a + r.paid, 0));
  return { member, from, to, rows, entitled, paid, balance: C.r2(entitled - paid), overall: st };
}
function report() {
  const d = S.data;
  if (!d.sharers.length || !d.wf.months.length) return '<div class="card empty" style="margin-top:22px">Nothing to report yet</div>';
  const { months } = repState(), r = reportData();
  return `<div class="section-head"><div><div class="eyebrow">Personal</div><h2>Income statement</h2></div>
    <div class="row"><button class="btn small" data-act="pdf">Download PDF</button><button class="btn ghost small" data-act="csv-report">CSV</button></div></div>
  <div class="card"><div class="two">
    <label class="f">Member<select id="repMember">${d.sharers.map(m => `<option value="${m.id}" ${m.id === r.member.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
    <div class="two"><label class="f">From<select id="repFrom">${months.map(m => `<option value="${m}" ${m === r.from ? 'selected' : ''}>${fMonth(m)}</option>`).join('')}</select></label>
    <label class="f">To<select id="repTo">${months.map(m => `<option value="${m}" ${m === r.to ? 'selected' : ''}>${fMonth(m)}</option>`).join('')}</select></label></div>
  </div></div>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Earned in period</div><div class="v gold">${big(r.entitled)}</div></div>
    <div class="card kpi good"><div class="l">Paid to you</div><div class="v">${big(r.paid)}</div></div>
    <div class="card kpi"><div class="l">Still owed overall</div><div class="v">${big(r.overall.balance)}</div><div class="n">across all months</div></div>
  </div>
  <div class="tablewrap" style="margin-top:14px"><table>
    <thead><tr><th>Month</th><th class="num">Building net</th><th class="num">Your share</th><th class="num">Paid to you</th><th>Paid on</th></tr></thead>
    <tbody>${r.rows.map(x => `<tr><td style="white-space:nowrap">${fMonth(x.month)}${x.inProgress ? ' ' + chip('gold', 'in progress') : ''}</td><td class="num">${num(x.buildingNet)}</td><td class="num" style="color:var(--gold-hi)">${num(x.entitlement)}</td><td class="num">${num(x.paid)}</td>
      <td class="small">${x.payouts.map(p => fDate(p.paid_on) + (p.reference ? ' · ' + esc(p.reference) : '')).join('<br>') || '<span class="faint">–</span>'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total (MVR)</td><td></td><td class="num">${num(r.entitled)}</td><td class="num">${num(r.paid)}</td><td></td></tr></tfoot>
  </table></div>`;
}

function activity() {
  const d = S.data;
  const describe = a => {
    const row = a.new_row || a.old_row || {};
    const verb = { INSERT: 'added', UPDATE: 'changed', DELETE: 'removed' }[a.action];
    const ln = id => esc(d.leaseById[id]?.tenant_name || 'a tenant');
    switch (a.table_name) {
      case 'payments': return `${verb} a collection of ${mvr(+row.rent_amount + +row.fine_amount)} from ${ln(row.lease_id)} for ${fMonth(C.monthKey(row.period || ''))}${row.source === 'advance' ? ' (from advance)' : ''}`;
      case 'distributions': return `${verb} a payout of ${mvr(row.amount)} to ${esc(d.memberById[row.member_id]?.name || 'a member')}`;
      case 'leases': return `${verb} the agreement for ${esc(row.tenant_name)}`;
      case 'expenses': return `${verb} an expense: ${esc(row.description)} (${mvr(row.amount)})`;
      case 'members': return `${verb} member ${esc(row.name)}`;
      case 'spaces': return `${verb} space ${esc(row.name)}`;
      case 'deposits': return `${verb} ${esc((DEPKIND[row.kind] || 'a deposit').toLowerCase())} of ${mvr(row.amount)} for ${ln(row.lease_id)}`;
      case 'fine_waivers': return `${verb} a fine waiver of ${mvr(row.amount)} for ${ln(row.lease_id)}, ${fMonth(C.monthKey(row.period || ''))}: ${esc(row.reason)}`;
      case 'rent_steps': return `${verb} a rent change to ${mvr(row.monthly_rent)} from ${fMonth(C.monthKey(row.effective_from || ''))} for ${ln(row.lease_id)}`;
      case 'attachments': return `${verb} ${row.kind === 'agreement' ? 'the signed agreement' : 'a receipt for ' + fMonth(C.monthKey(row.period || ''))} for ${ln(row.lease_id)} (${esc(row.file_name)})`;
      case 'invoices': return a.action === 'INSERT' ? `issued ${esc((KIND[row.kind] || 'invoice').toLowerCase())} ${esc(row.number)} to ${ln(row.lease_id)}` : `updated invoice ${esc(row.number)} (${esc(row.status)})`;
      default: return `${verb} settings`;
    }
  };
  const rows = d.audit.filter(a => !(a.table_name === 'invoices' && a.action === 'UPDATE'));
  return `<div class="section-head"><div><div class="eyebrow">Permanent record</div><h2>Activity log</h2></div></div>
  <p class="muted small" style="margin-top:-6px">Every change to the records is logged here automatically and cannot be edited.</p>
  <div class="card">${rows.length ? rows.map(a => `<div class="alert"><div class="small faint" style="min-width:120px">${new Date(a.at).toLocaleString('en-GB', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div><div><b style="color:var(--gold-hi);font-weight:500">${esc((a.actor || '').split('@')[0])}</b> ${describe(a)}</div></div>`).join('') : '<div class="empty">No activity yet</div>'}</div>`;
}

/* ---------- drill-downs: how each figure on the overview is built ---------- */
const sumBox = items => `<div class="split">${items.filter(Boolean).map(([l, v, c]) => `<div class="card"><div class="small faint">${l}</div><div${c ? ` style="color:${c}"` : ''}>${v}</div></div>`).join('')}</div>`;
const dh = (t, note = '') => `<h3 style="margin:22px 0 8px;font-size:1.15rem">${t}</h3>${note ? `<p class="small faint" style="margin:-2px 0 10px">${note}</p>` : ''}`;
const dtable = (head, rows, foot) => `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows || '<tr><td class="empty" colspan="9">Nothing recorded</td></tr>'}</tbody>${foot ? `<tfoot><tr>${foot}</tr></tfoot>` : ''}</table></div>`;
const goRow = (attrs, cells) => `<tr ${attrs} class="go">${cells}</tr>`;

function drillShell(eyebrow, title, sub, body, back) {
  dlg.className = 'wide';
  dlg.innerHTML = `<div class="inner">
    <div class="dhead"><div>${back ? `<button class="linkbtn" data-drill="${esc(back)}" style="margin-bottom:8px">‹ Back</button>` : ''}<div class="eyebrow">${eyebrow}</div><h3 style="margin:0 0 4px">${title}</h3>${sub ? `<p class="small faint" style="margin:0;max-width:640px">${sub}</p>` : ''}</div><button class="iconbtn" data-x="close" style="font-size:1.2rem;flex:none" aria-label="Close">✕</button></div>
    ${body}</div>`;
  dlg.querySelector('[data-x=close]').onclick = () => dlg.close();
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

function drill(key, back) {
  const i = key.indexOf(':'), kind = i < 0 ? key : key.slice(0, i), arg = i < 0 ? '' : key.slice(i + 1);
  const fn = { month: drillMonth, since: drillSince, overdue: drillOverdue, paid: drillPaid, member: drillMember, held: drillHeld, roll: drillRoll }[kind];
  if (fn) fn(arg, back);
}

function drillMonth(k, back) {
  const d = S.data, wf = d.wf, m = wf.months.find(x => x.month === k);
  if (!m) return toast('No figures recorded for ' + fMonth(k));
  const me = `month:${k}`;
  const pays = d.payments.filter(p => C.monthKey(p.received_on) === k).sort((a, b) => (a.received_on < b.received_on ? -1 : 1));
  const shared = d.deposits.filter(x => x.kind === 'security_retained' && C.monthKey(x.occurred_on) === k);
  const exps = d.expenses.filter(e => C.monthKey(e.spent_on) === k);
  const outs = d.distributions.filter(x => C.monthKey(x.for_month) === k);
  const fixed = wf.fixedIds.map(id => d.memberById[id]), eq = wf.equalIds.length;
  const due = d.leases.map(l => ({ l, r: d.sched[l.id].rows.find(x => x.month === k) })).filter(x => x.r && x.r.rent > 0);
  const paidOut = outs.reduce((a, x) => a + +x.amount, 0), toShare = Object.values(m.shares).reduce((a, x) => a + x, 0);
  const otherNote = pays.filter(p => C.monthKey(p.period) !== k).length;

  const calc = [
    ['Rent received', m.rent], m.fines ? ['Late fines received', m.fines] : null,
    m.other ? ['Deposits and advances shared out', m.other] : null,
    m.expenses ? ['Less building expenses', -m.expenses] : null
  ].filter(Boolean).map(([l, v]) => `<tr><td>${l}</td><td class="num">${v < 0 ? '− ' + num(-v) : num(v)}</td></tr>`).join('')
    + `<tr><td><b>Money to share</b></td><td class="num"><b>${num(m.net)}</b></td></tr>`
    + fixed.map(f => `<tr><td>${esc(f.name)} <span class="faint">(fixed, paid first)</span></td><td class="num">− ${num(m.shares[f.id] || 0)}</td></tr>`).join('')
    + `<tr><td>Balance shared equally by ${eq}</td><td class="num">${num(C.r2(m.perSibling * eq))}</td></tr>`
    + `<tr><td style="color:var(--gold-hi)">Each sibling</td><td class="num" style="color:var(--gold-hi);font-weight:600">${num(m.perSibling)}</td></tr>`;

  const body = `
    ${sumBox([['Rent and fines received', mvr(m.rent + m.fines)], m.other ? ['Deposits shared out', mvr(m.other)] : null, ['Money to share', mvr(m.net)], ['Each sibling', mvr(m.perSibling), 'var(--gold-hi)']])}
    ${dh('How the share was worked out', `Shares follow the cash that arrived in ${fMonth(k)}, whichever month it was paid for.${m.fixedShortfall ? ` ${mvr(m.fixedShortfall)} of the fixed amount was short and carries into the next month.` : ''}`)}
    <div class="tablewrap"><table><tbody>${calc}</tbody></table></div>
    ${due.length ? dh('Rent due for ' + fMonth(k), 'Tap a tenant to open their full rent record.') + dtable('<th>Tenant</th><th class="num">Rent due</th><th class="num">Received</th><th class="num">Outstanding</th><th>Status</th>',
      due.map(({ l, r }) => goRow(`data-statement="${l.id}"`, `<td>${esc(d.leaseName(l))}</td><td class="num">${num(r.rent)}</td><td class="num">${num(r.rentPaid)}</td><td class="num">${r.rentOutstanding ? `<b style="color:var(--warn)">${num(r.rentOutstanding)}</b>` : '–'}</td><td>${chip(STATUS[r.status][0], STATUS[r.status][1](r))}</td>`)).join(''),
      `<td>Total (MVR)</td><td class="num">${num(due.reduce((a, x) => a + x.r.rent, 0))}</td><td class="num">${num(due.reduce((a, x) => a + x.r.rentPaid, 0))}</td><td class="num">${num(due.reduce((a, x) => a + x.r.rentOutstanding, 0))}</td><td></td>`) : ''}
    ${dh(`Money received in ${fMonth(k)}`, otherNote ? `${otherNote} payment(s) were for another month, such as rent paid early or late. They still count towards ${fMonth(k)}'s share because that is when the money arrived.` : '')}
    ${dtable('<th>Received</th><th>Tenant</th><th>For</th><th class="num">Amount</th><th>Reference</th>',
      pays.map(p => { const l = d.leaseById[p.lease_id]; return goRow(`data-statement="${p.lease_id}"`, `<td style="white-space:nowrap">${fDate(p.received_on)}</td><td>${esc(d.leaseName(l))}</td><td style="white-space:nowrap">${fMonth(C.monthKey(p.period))}</td><td class="num">${num(+p.rent_amount + +p.fine_amount)}</td><td class="small">${esc([p.method, p.reference].filter(Boolean).join(' · '))}${p.note ? `<div class="faint">${esc(p.note)}</div>` : ''}</td>`); }).join(''),
      `<td colspan="3">Total (MVR)</td><td class="num">${num(m.rent + m.fines)}</td><td></td>`)}
    ${shared.length ? dh('Deposits and advances shared out', 'These were distributed to the co-owners when received, so they count as money to share this month.') + dtable('<th>Date</th><th>Tenant</th><th class="num">Amount</th><th>Note</th>',
      shared.map(x => goRow(`data-statement="${x.lease_id}"`, `<td>${fDate(x.occurred_on)}</td><td>${esc(d.leaseName(d.leaseById[x.lease_id]))}</td><td class="num">${num(x.amount)}</td><td class="small faint">${esc(x.note || '')}</td>`)).join('')) : ''}
    ${exps.length ? dh('Building expenses') + dtable('<th>Date</th><th>Description</th><th class="num">Amount</th>', exps.map(e => `<tr><td>${fDate(e.spent_on)}</td><td>${esc(e.description)}</td><td class="num">${num(e.amount)}</td></tr>`).join('')) : ''}
    ${dh('Paid out to the family for ' + fMonth(k), `${mvr(paidOut)} paid against ${mvr(toShare)} earned for this month. Tap a member for their full history.`)}
    ${dtable('<th>Member</th><th class="num">Earned</th><th class="num">Paid</th><th>Paid on</th><th>Method</th>',
      d.sharers.map(mm => { const ps = outs.filter(x => x.member_id === mm.id), p = ps.reduce((a, x) => a + +x.amount, 0), e = m.shares[mm.id] || 0;
        return goRow(`data-drill="member:${mm.id}" data-back="${me}"`, `<td>${esc(mm.name)}</td><td class="num">${num(e)}</td><td class="num">${C.r2(p - e) < 0 ? `<b style="color:var(--warn)">${num(p)}</b>` : num(p)}</td><td style="white-space:nowrap">${[...new Set(ps.map(x => fDate(x.paid_on)))].join(', ') || '<span class="faint">–</span>'}</td><td class="small">${esc([...new Set(ps.map(x => x.method).filter(Boolean))].join(', '))}</td>`); }).join(''),
      `<td>Total (MVR)</td><td class="num">${num(toShare)}</td><td class="num">${num(paidOut)}</td><td colspan="2"></td>`)}`;
  drillShell(m.inProgress ? 'Month in progress' : 'Month', fMonth(k), '', body, back);
}

function drillSince(arg, back) {
  const d = S.data, wf = d.wf, ms = wf.months.slice().reverse();
  const t = k => wf.months.reduce((a, m) => a + m[k], 0);
  const byLease = d.leases.map(l => { const ps = d.payments.filter(p => p.lease_id === l.id); return { l, n: ps.length, amt: ps.reduce((a, p) => a + +p.rent_amount + +p.fine_amount, 0), first: ps.map(p => p.received_on).sort()[0], last: ps.map(p => p.received_on).sort().pop() }; }).filter(x => x.n).sort((a, b) => b.amt - a.amt);
  const body = `
    ${sumBox([['Rent and fines received', mvr(t('rent') + t('fines'))], t('other') ? ['Deposits and advances shared', mvr(t('other'))] : null, t('expenses') ? ['Building expenses', mvr(t('expenses'))] : null, ['Months', wf.months.length]])}
    ${dh('Month by month', 'Tap a month to see every payment received and how it was shared.')}
    ${dtable('<th>Month</th><th class="num">Rent and fines</th><th class="num">Deposits shared</th><th class="num">Expenses</th><th class="num">To share</th><th class="num">Each sibling</th>',

/* ---------- forms ---------- */
const opt = (arr, v) => arr.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(v ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
function field(f, v) {
  if (f.type === 'checkbox') return `<label class="chk"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
  let input;
  if (f.type === 'file') input = `<input type="file" name="${f.name}" accept="${f.accept || ''}" ${f.required ? 'required' : ''}>`;
  else if (f.type === 'select') input = `<select name="${f.name}" ${f.required ? 'required' : ''}>${opt(f.options, v)}</select>`;
  else if (f.type === 'textarea') input = `<textarea name="${f.name}" rows="3">${esc(v)}</textarea>`;
  else {
    const val = f.type === 'month' && v ? v.slice(0, 7) : v;
    input = `<input type="${f.type || 'text'}" name="${f.name}" value="${esc(val ?? '')}" ${f.required ? 'required' : ''} ${f.type === 'number' ? 'step="0.01" min="0" inputmode="decimal"' : ''}>`;
  }
  return `<label class="f">${esc(f.label)}${input}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</label>`;
}
function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.name];
    if (f.type === 'checkbox') out[f.name] = el.checked;
    else if (f.type === 'file') out[f.name] = el.files && el.files[0] || null;
    else {
      let v = el.value.trim();
      if (v === '') v = null; else if (f.type === 'number') v = +v; else if (f.type === 'month') v = v + '-01';
      out[f.name] = v;
    }
  }
  return out;
}
let returnTo = null; // reopen a statement after a form closes
function openForm({ title, fields, values = {}, submit, onDelete, onInput, intro = '', saveLabel = 'Save' }) {
  const parts = [];
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i];
    if (f.half && fields[i + 1]?.half) { parts.push(`<div class="two">${field(f, values[f.name])}${field(fields[i + 1], values[fields[i + 1].name])}</div>`); i++; }
    else parts.push(field(f, values[f.name]));
  }
  dlg.className = '';
  dlg.innerHTML = `<form class="inner"><h3>${esc(title)}</h3>${intro}${parts.join('')}
    <div class="row between" style="margin-top:10px"><div>${onDelete ? '<button type="button" class="btn danger small" data-x="del">Delete</button>' : ''}</div>
    <div class="row"><button type="button" class="btn ghost" data-x="cancel">Cancel</button><button class="btn" type="submit">${saveLabel}</button></div></div></form>`;
  const form = dlg.querySelector('form');
  form.querySelector('[data-x=cancel]').onclick = closeForm;
  if (onDelete) form.querySelector('[data-x=del]').onclick = async () => { if (confirm('Delete this permanently?')) { await onDelete(); closeForm(); } };
  if (onInput) { form.oninput = e => onInput(form, e); onInput(form, {}); }
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try { const ok = await submit(readForm(form, fields), form); if (ok !== false) closeForm(); }
    finally { btn.disabled = false; }
  };
  if (!dlg.open) dlg.showModal();
}
function closeForm() {
  if (returnTo) { const id = returnTo; returnTo = null; statement(id); } else dlg.close();
}

async function save(table, row, id) {
  const q = id ? sb.from(table).update(row).eq('id', id) : sb.from(table).insert(row);
  const { error } = await q;
  if (error) { toast(error.message); return false; }
  toast('Saved'); await load(); return true;
}
async function del(table, id) {
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) toast(error.message); else { toast('Deleted'); await load(); if (dlg.open && dlg.className === 'wide' && returnTo === null && S.lastStatement) statement(S.lastStatement); }
}

const METHODS = [['Bank transfer', 'Bank transfer'], ['Cash', 'Cash'], ['Cheque', 'Cheque'], ['Other', 'Other']];

function payForm(preLease, preMonth, preSource) {
  const d = S.data, t = d.today;
  const leases = d.leases.slice().sort((a, b) => (C.leaseStatus(a, t).key === 'ended') - (C.leaseStatus(b, t).key === 'ended'));
  const owing = preLease ? d.leaseById[preLease] : leases.find(l => d.sched[l.id].rows.some(r => r.rentOutstanding > 0));
  const firstOwing = owing && (preMonth ? { month: preMonth } : d.sched[owing.id].rows.find(r => r.rentOutstanding > 0));
  const fields = [
    { name: 'lease_id', label: 'Tenant and space', type: 'select', required: true, options: leases.map(l => [l.id, d.leaseName(l) + (C.leaseStatus(l, t).key === 'ended' ? ' (ended)' : '')]) },
    { name: 'source', label: 'Paid from', type: 'select', options: [['tenant', 'Payment from tenant'], ['advance', 'Advance rent already held']] },
    { name: 'period', label: 'Rent month', type: 'month', required: true, half: true },
    { name: 'received_on', label: 'Date received', type: 'date', required: true, half: true },
    { name: 'rent_amount', label: 'Rent (MVR)', type: 'number', required: true, half: true },
    { name: 'fine_amount', label: 'Late fine (MVR)', type: 'number', half: true },
    { name: 'method', label: 'Method', type: 'select', options: METHODS, half: true },
    { name: 'reference', label: 'Reference', half: true },
    { name: 'note', label: 'Note', type: 'textarea' },
    { name: 'receipt', label: 'Bank slip or receipt (optional: PDF or photo, up to 10 MB)', type: 'file', accept: 'application/pdf,image/*' },
    { name: 'email_receipt', label: 'Email a paid receipt (PDF) to the tenant', type: 'checkbox' }
  ];
  let fineTouched = false;
  openForm({
    title: preSource === 'advance' ? 'Use advance for rent' : 'Rent received', fields,
    values: { lease_id: owing?.id, source: preSource || 'tenant', period: (firstOwing?.month || C.monthKey(t)) + '-01', received_on: t, method: preSource === 'advance' ? 'Other' : 'Bank transfer', email_receipt: !!owing?.tenant_email },
    intro: '<div class="card small" id="payHint" style="margin:-4px 0 14px;padding:12px 14px"></div>',
    onInput: (form, e) => {
      const E = form.elements, name = e.target?.name;
      if (name === 'fine_amount') { fineTouched = true; return; }
      if (name && !['lease_id', 'period', 'received_on', 'rent_amount', 'source'].includes(name)) return;
      const l = d.leaseById[E.lease_id.value], k = E.period.value, dp = d.dep[l.id];
      if (name === 'lease_id') E.email_receipt.checked = !!l.tenant_email;
      const row = d.sched[l.id].rows.find(r => r.month === k);
      const hint = document.getElementById('payHint');
      const adv = E.source.value === 'advance' ? ` Advance left: <b>${mvr(dp.advanceBalance)}</b>.` : '';
      if (!row) { const rk = C.rentFor(l, k); if (!name || name === 'lease_id' || name === 'period') E.rent_amount.value = rk; hint.innerHTML = `Rent for ${fMonth(k)}: ${mvr(rk)}.${adv}`; return; }
      if (!name || name === 'lease_id' || name === 'period' || name === 'source') {
        let amt = row.rentOutstanding;
        if (E.source.value === 'advance') amt = Math.min(amt, dp.advanceBalance);
        E.rent_amount.value = amt || '';
      }
      // auto fine: if this payment completes the month's rent, fine is fixed by the date received
      const completes = +E.rent_amount.value + row.rentPaid >= row.rent - 0.005;
      const autoFine = completes && E.received_on.value ? C.fineIfPaidOn(l, row, E.received_on.value, d.settings) : row.fineOutstanding;
      if (!fineTouched) E.fine_amount.value = autoFine || '';
      hint.innerHTML = `<b>${fMonth(k)}</b>: ${mvr(row.rent)} due ${fDate(row.deadline)}, ${mvr(row.rentPaid)} already received.${row.fineWaived ? ` ${mvr(row.fineWaived)} of fines waived.` : ''}<br>`
        + (l.fine_type === 'none' ? 'No late fine in this agreement.' : completes ? `Fine for payment on ${fDate(E.received_on.value)}: <b style="color:var(--gold-hi)">${mvr(autoFine)}</b> (calculated automatically).` : `Part payment: the fine keeps accruing until the rent is paid in full.`) + adv;
    },
    submit: async v => {
      if (!v.rent_amount && !v.fine_amount) { toast('Enter a rent or fine amount'); return false; }
      if (v.source === 'advance') {
        const bal = d.dep[v.lease_id].advanceBalance;
        if ((v.rent_amount || 0) + (v.fine_amount || 0) > bal + 0.005) { toast(`Only ${mvr(bal)} of advance is left for this tenant`); return false; }
      }
      const { receipt, email_receipt, ...row } = v;
      if (email_receipt && !d.leaseById[row.lease_id].tenant_email) { toast('This tenant has no email. Untick "Email a paid receipt" or add the email to the agreement.', 6000); return false; }
      if (email_receipt && C.daysBetween(row.received_on, t) > 14 && !confirm('This payment is more than two weeks old. Email the tenant a receipt for it anyway?')) return false;
      if (receipt) {
        try { await uploadDoc(receipt, { kind: 'receipt', lease_id: row.lease_id, period: row.period, label: row.reference || null }); }
        catch (e) { toast('Slip not attached: ' + e.message, 6000); return false; }
      }
      const { data: saved, error } = await sb.from('payments').insert({ ...row, rent_amount: row.rent_amount || 0, fine_amount: row.fine_amount || 0 }).select().single();
      if (error) { toast(error.message); return false; }
      toast('Payment saved'); await load();
      if (email_receipt) await sendReceipt(saved.id, true);
    }
  });
}

function openPdfB64(b64, name) {
  const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u], { type: 'application/pdf' }));
  const w = window.open(url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

const CLIP = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l9.2-9.2a3.7 3.7 0 015.2 5.2l-9.2 9.2a1.8 1.8 0 01-2.6-2.6l8.5-8.5"/></svg>';
const MIME = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic', heif: 'image/heif', webp: 'image/webp' };
function docChip(a, removable) {
  const short = a.file_name.length > 26 ? a.file_name.slice(0, 22) + '…' + a.file_name.slice(a.file_name.lastIndexOf('.')) : a.file_name;
  return `<span class="docs"><button class="doc" data-doc="${a.id}" title="${esc(a.file_name)}">${CLIP}${esc(a.label || short)}</button>${removable && S.data.me?.is_admin ? `<button class="iconbtn" title="Remove" data-deldoc="${a.id}">✕</button>` : ''}</span>`;
}
async function uploadDoc(file, { kind, lease_id, period, label }) {
  if (!file) throw new Error('Choose a file first');
  if (file.size > 10 * 1024 * 1024) throw new Error('That file is over 10 MB. Please use a smaller scan or photo.');
  const ext = (file.name.includes('.') ? file.name.split('.').pop() : 'pdf').toLowerCase();
  const type = file.type || MIME[ext];
  if (!type || !Object.values(MIME).includes(type)) throw new Error('Only PDF files or photos (JPG, PNG, HEIC) can be attached');
  if (kind === 'agreement' && type !== 'application/pdf') throw new Error('Please attach the signed agreement as a PDF');
  const path = `${kind}/${lease_id}/${period ? period.slice(0, 7) + '/' : ''}${crypto.randomUUID()}.${ext}`;
  const up = await sb.storage.from('documents').upload(path, file, { contentType: type, upsert: false });
  if (up.error) throw new Error(up.error.message);
  const ins = await sb.from('attachments').insert({ kind, lease_id, period: period || null, file_path: path, file_name: file.name, size_bytes: file.size, mime: type, label: label || null });
  if (ins.error) { await sb.storage.from('documents').remove([path]); throw new Error(ins.error.message); }
}
async function openDoc(id) {
  const a = S.data.attById[id]; if (!a) return;
  const w = window.open('', '_blank'); // open first so mobile browsers don't block it
  const { data, error } = await sb.storage.from('documents').createSignedUrl(a.file_path, 300);
  if (error) { if (w) w.close(); return toast(error.message); }
  if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
}
async function deleteDoc(id) {
  const a = S.data.attById[id]; if (!a) return;
  if (!confirm(`Remove ${a.file_name}? The file is deleted permanently; the activity log keeps a record that it existed.`)) return;
  const r1 = await sb.from('attachments').delete().eq('id', id);
  if (r1.error) return toast(r1.error.message);
  await sb.storage.from('documents').remove([a.file_path]);
  toast('Removed'); await load(); if (dlg.open && S.lastStatement) statement(S.lastStatement);
}
